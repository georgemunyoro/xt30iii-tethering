name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyusb==1.3.1 libusb1==3.3.1
      - if: runner.os == 'Windows'
        run: python -m pip install libusb-package==1.0.30.1 uv==0.13.4
      - run: python -m unittest discover -s enabler -p 'test_*.py' -v
      - name: Install UsbDk on the Windows test runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'UsbDk_1.0.22_x64.msi'
          Invoke-WebRequest 'https://github.com/daynix/UsbDk/releases/download/v1.00-22/UsbDk_1.0.22_x64.msi' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '91f6f695e1e13c656024e6d3b55620bf08d8835ef05ee0496935ba6bb62466a5') {
            throw 'Unexpected UsbDk installer checksum'
          }
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /qn /norestart" -Wait -PassThru
          if ($install.ExitCode -notin 0, 3010) { throw "UsbDk installer exited $($install.ExitCode)" }
      - name: Initialize both USB transports with the actual Windows driver
        if: runner.os == 'Windows'
        run: python enabler/utility.py --check-usb
